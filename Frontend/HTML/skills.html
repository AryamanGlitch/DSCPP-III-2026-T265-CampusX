<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b14" />
  <title>Skill Gap | CampusX</title>
  <!-- Apply the saved theme before first paint, so the page never flashes the wrong colours -->
  <script>try { var t = localStorage.getItem('campusx:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="skills">
  <div class="aurora" aria-hidden="true"></div>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a href="/" class="brand" aria-label="CampusX home"><svg class="icon brand-mark" aria-hidden="true"><use href="/img/icons.svg#logo"/></svg><span class="brand-word">CampusX</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="/" data-page="home"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#home"/></svg><span>Home</span></a>
      <a href="/search.html" data-page="search"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#search"/></svg><span>Search</span></a>
      <a href="/feed.html" data-page="feed"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#feed"/></svg><span>Feed</span></a>
      <a href="/partners.html" data-page="partners"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#team"/></svg><span class="nav-long">Find Project Partner</span><span class="nav-short">Partners</span></a>
      <a href="/skills.html" data-page="skills"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#learn"/></svg><span class="nav-long">Skill Gap</span><span class="nav-short">Skills</span></a>
      <a href="/emergency.html" data-page="emergency" class="topnav-emergency"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#alert"/></svg><span>Emergency</span></a>
    </nav>
    <div class="topbar-tools">
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Switch theme"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#sun"/></svg></button>
      <div id="user-slot" class="topbar-user"></div>
    </div>
  </header>
  <main id="main" class="page page-wide">
    <div class="partners-head reveal">
      <div>
        <h1 class="page-title">Skill gap &amp; learning</h1>
        <p class="muted partners-sub">Pick a goal. CampusX compares it with the skills in your profile, works out what to learn first, and ranks learning videos suggested by Gemini.</p>
      </div>
    </div>
    <section class="reveal" style="--i:1" aria-labelledby="goal-title">
      <h2 id="goal-title" class="sr-only">Learning goal</h2>
      <div id="goals" class="goal-grid" role="radiogroup" aria-label="Learning goal"></div>
    </section>
    <p id="skills-status" class="status-line" role="status"></p>
    <section id="view" class="reveal" style="--i:2" aria-live="polite"></section>
  </main>
  <script type="module" src="/js/skills.js"></script>
</body>
</html>
