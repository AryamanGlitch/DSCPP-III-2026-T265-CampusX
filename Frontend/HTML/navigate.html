<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b14" />
  <title>Directions | CampusX</title>
  <!-- Apply the saved theme before first paint, so the page never flashes the wrong colours -->
  <script>try { var t = localStorage.getItem('campusx:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="navigate" class="nav-mode">
  <div class="aurora" aria-hidden="true"></div>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a href="/" class="brand" aria-label="CampusX home"><svg class="icon brand-mark" aria-hidden="true"><use href="/img/icons.svg#logo"/></svg><span class="brand-word">CampusX</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="/" data-page="home"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#home"/></svg><span>Home</span></a>
      <a href="/search.html" data-page="search"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#search"/></svg><span>Search</span></a>
      <a href="/feed.html" data-page="feed"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#feed"/></svg><span>Feed</span></a>
      <a href="/emergency.html" data-page="emergency" class="topnav-emergency"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#alert"/></svg><span>Emergency</span></a>
    </nav>
    <div class="topbar-tools">
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Switch theme"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#sun"/></svg></button>
      <div id="user-slot" class="topbar-user"></div>
    </div>
  </header>
  <main id="main" class="page">
    <div class="emergency-head reveal">
      <h1 id="em-title" class="page-title">Directions</h1>
      <span id="em-status" class="pill">Loading map…</span>
    </div>
    <section id="contacts" class="contacts" aria-label="Emergency phone numbers" hidden>
      <!-- Works even before JavaScript or the map loads -->
      <a class="contact" href="tel:112"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#phone"/></svg><span class="contact-name">National Emergency (India)</span><span class="contact-phone">112</span></a>
    </section>
    <div id="mode" class="reveal" style="--i:2"></div>
    <section id="locator" class="locator panel" aria-labelledby="locator-title" hidden>
      <div class="panel-head"><h2 id="locator-title"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#pin"/></svg> Where are you?</h2>
        <button id="gps" type="button" class="btn btn-glass btn-sm"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#locate"/></svg>Use my GPS location</button></div>
      <p id="gps-status" class="small" role="status"></p>
      <div class="locator-grid">
        <label>Building<select id="sel-building"></select></label>
        <label id="floor-field">Floor<select id="sel-floor"></select></label>
        <label><span id="spot-label">Nearest landmark</span><select id="sel-spot"></select></label>
      </div>
    </section>
    <div id="hazard-banner"></div>
    <div id="result"></div>
    <div id="admin"></div>
    <p class="small muted footnote">Everyday directions. In an emergency, use the red Emergency tab instead: it avoids lifts and routes you to the nearest safe point.</p>
  </main>
  <script type="module" src="/js/emergency.js"></script>
</body>
</html>
